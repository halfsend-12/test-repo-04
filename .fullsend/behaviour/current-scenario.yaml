ops:
    - description: See the placeholder
      op: assert_env
      args: INFERENCE_GATEWAY_API_KEY
    - description: Placeholder is no JWT
      op: assert_not_jwt
      args: INFERENCE_GATEWAY_API_KEY
    - description: Call the gateway
      op: http_probe
      args: POST https://fullsend-e2e-gateway-208332380190.us-east5.run.app/v1/chat/completions INFERENCE_GATEWAY_API_KEY {"model":"echo","messages":[{"role":"user","content":"ping"}]}
    - description: Call denied model
      op: http_probe
      args: POST https://fullsend-e2e-gateway-208332380190.us-east5.run.app/v1/chat/completions INFERENCE_GATEWAY_API_KEY {"model":"echo-denied","messages":[{"role":"user","content":"ping"}]}
      expect_fail: true
    - description: List models on gateway
      op: http_probe
      args: GET https://fullsend-e2e-gateway-208332380190.us-east5.run.app/v1/models INFERENCE_GATEWAY_API_KEY
      expect_fail: true
    - description: Reach another host
      op: http_probe
      args: GET https://example.com/ INFERENCE_GATEWAY_API_KEY
      expect_fail: true
    - description: Emit triage JSON
      op: write_fixture
      args: output/agent-result.json, fixtures/triage/sufficient.json
      content: |
        {
          "action": "sufficient",
          "reasoning": "Issue includes clear reproduction steps and environment details.",
          "clarity_scores": {
            "symptom": 0.9,
            "cause": 0.85,
            "reproduction": 0.9,
            "impact": 0.8,
            "overall": 0.87
          },
          "triage_summary": {
            "title": "Login fails",
            "severity": "high",
            "category": "bug",
            "problem": "Application crashes on login",
            "root_cause_hypothesis": "Session handling regression",
            "reproduction_steps": ["Open app", "Enter credentials", "Click login"],
            "environment": "Linux",
            "impact": "Users cannot authenticate",
            "recommended_fix": "Fix session token validation",
            "proposed_test_case": "test_login_success"
          },
          "comment": "## Triage Summary\n\nThis issue is ready for implementation."
        }
